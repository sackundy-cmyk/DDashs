<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>D-Dash · Admin Dashboard</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            color: #1e293b;
            line-height: 1.5;
        }
        .app { display: flex; min-height: 100vh; }
        
        /* ---------- LOGIN PAGE (Role Selection) ---------- */
        .login-container {
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
            background: linear-gradient(145deg, #0b2b5e 0%, #1e4a8b 100%);
        }
        .login-card {
            background: white; border-radius: 32px; padding: 40px; width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .login-card h2 { color: #0b2b5e; margin-bottom: 24px; }
        .role-selector {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .role-btn {
            flex: 1; padding: 12px; border-radius: 40px; border: 1.5px solid #e2e8f0;
            background: white; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .role-btn.active {
            background: #2563eb; color: white; border-color: #2563eb;
        }
        .login-input {
            width: 100%; padding: 14px 18px; border-radius: 40px; border: 1.5px solid #e2e8f0;
            margin-bottom: 16px; font-size: 1rem;
        }
        .login-btn {
            background: #2563eb; color: white; border: none; padding: 14px; width: 100%;
            border-radius: 40px; font-weight: 700; cursor: pointer; font-size: 1rem;
        }
        .error-msg { color: #dc2626; margin-top: 8px; }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0b2b5e 0%, #123b6e 100%);
            color: #e0edff;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,20,50,0.08);
        }
        .logo-area {
            display: flex; align-items: center; gap: 12px;
            padding: 0 12px 32px 12px; border-bottom: 1px solid #2a4a7a;
        }
        .logo-icon {
            background: #3b82f6; width: 40px; height: 40px;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: white; box-shadow: 0 8px 16px -4px rgba(59,130,246,0.3);
        }
        .logo-text { font-weight: 700; font-size: 20px; color: white; }
        .nav-menu { flex: 1; margin-top: 24px; }
        .nav-item {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px;
            border-radius: 16px; color: #bdd3f0; font-weight: 500; margin-bottom: 6px;
            transition: all 0.2s; cursor: pointer;
        }
        .nav-item i { width: 24px; font-size: 1.25rem; }
        .nav-item.active { background: #1e4a8b; color: white; }
        .nav-item:not(.active):hover { background: #1a3f6e; color: #f0f7ff; }
        .bottom-sidebar { padding-top: 24px; border-top: 1px solid #2a4a7a; margin-top: 16px; }
        .about-section {
            margin-top: 16px; padding: 16px; background: #1a3f6e; border-radius: 20px;
            font-size: 0.9rem; color: #cbdffa; cursor: pointer;
        }

        /* ---------- MAIN ---------- */
        .main-content {
            flex: 1; background: #f8fafd; padding: 24px 32px; overflow-y: auto;
        }
        .page-view { display: none; }
        .page-view.active { display: block; }

        .top-bar {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;
            flex-wrap: wrap; gap: 16px;
        }
        .page-title h1 { font-size: 26px; font-weight: 700; color: #0b2b5e; }
        .top-actions { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .notification-badge {
            background: white; padding: 10px 14px; border-radius: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            display: flex; align-items: center; gap: 10px; border: 1px solid #e2e8f0;
        }
        .quick-remind-btn, .logout-btn {
            background: #2563eb; color: white; border: none; padding: 10px 20px;
            border-radius: 40px; font-weight: 600; display: flex; align-items: center; gap: 10px;
            cursor: pointer;
        }
        .logout-btn { background: #64748b; }
        .profile-chip {
            background: white; padding: 6px 12px 6px 18px; border-radius: 40px;
            border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px;
        }

        /* Cards & Grids */
        .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 22px; margin-bottom: 30px; }
        .stat-card {
            background: white; padding: 22px 20px; border-radius: 24px;
            box-shadow: 0 10px 25px -8px rgba(0,0,0,0.06); border: 1px solid #edf2f7;
        }
        .stat-value { font-size: 36px; font-weight: 700; color: #0b2b5e; }
        .chart-card { background: white; border-radius: 24px; padding: 18px 20px; margin-bottom: 30px; }
        .action-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
        .panel { background: white; border-radius: 24px; padding: 20px; border:1px solid #eef3f9; }
        .table-section { background: white; border-radius: 24px; padding: 20px 24px; overflow-x: auto; }
        .student-table, .teacher-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .student-table th, .teacher-table th { text-align: left; padding: 14px 8px; color: #64748b; border-bottom: 1.5px solid #eef3f9; }
        .student-table td, .teacher-table td { padding: 16px 8px; border-bottom: 1px solid #f1f5f9; }
        .status-pill { padding: 6px 14px; border-radius: 40px; font-weight: 600; font-size: 13px; display: inline-block; }
        .status-excellent { background: #d1fae5; color: #065f46; } .status-good { background: #fef9c3; color: #854d0e; } .status-need { background: #fee2e2; color: #b91c1c; }
        .btn-outline {
            background: white; border: 1.5px solid #dce5ec; padding: 8px 16px; border-radius: 40px;
            font-weight: 600; color: #1e3a6b; cursor: pointer;
        }
        .btn-primary { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .filter-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-select, .search-input { padding: 10px 16px; border-radius: 40px; border: 1.5px solid #e2e8f0; background: white; }
        .student-grid, .teacher-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 20px; margin-top: 20px; }
        .student-card, .teacher-card {
            background: white; border-radius: 20px; padding: 20px; box-shadow: 0 8px 18px rgba(0,0,0,0.04);
            border: 1px solid #eef3f9; cursor: pointer; transition: transform 0.1s;
        }
        .student-card:hover, .teacher-card:hover { transform: translateY(-3px); }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal {
            background: white; border-radius: 32px; padding: 28px; max-width: 800px; width: 90%; max-height: 85vh; overflow-y: auto;
        }
        .student-link, .teacher-link { color: #2563eb; font-weight: 600; cursor: pointer; }
        .toggle-switch { width: 48px; height: 26px; background: #cbd5e1; border-radius: 40px; position: relative; cursor: pointer; }
        .toggle-switch.active { background: #10b981; }
        .toggle-switch::after { content: ""; width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; top:3px; left:3px; transition:0.2s; }
        .toggle-switch.active::after { left:25px; }

        @media (max-width: 900px) {
            .sidebar { width: 90px; padding: 20px 8px; }
            .logo-text, .nav-item span, .about-section p, .about-section strong { display: none; }
            .nav-item { justify-content: center; }
            .main-content { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr; }
            .action-panels { grid-template-columns: 1fr; }
        }
        .footer-note { margin-top: 16px; text-align: right; color: #5f7d9c; }
    </style>
</head>
<body>
<!-- LOGIN PAGE (Role Selection) -->
<div id="loginPage" class="login-container">
    <div class="login-card">
        <h2><i class="fas fa-chart-line" style="margin-right: 10px;"></i>D-Dash Login</h2>
        <div class="role-selector">
            <div class="role-btn active" data-role="student">Student</div>
            <div class="role-btn" data-role="teacher">Teacher</div>
            <div class="role-btn" data-role="admin">Admin</div>
        </div>
        <input type="text" id="loginUsername" class="login-input" placeholder="Username / Email" value="admin@ddash.com">
        <input type="password" id="loginPassword" class="login-input" placeholder="Password" value="admin123">
        <button class="login-btn" onclick="login()">Sign In</button>
        <div id="loginError" class="error-msg"></div>
        <p style="margin-top: 16px; font-size:0.9rem;">Demo: admin@ddash.com / admin123</p>
    </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div id="mainApp" class="app" style="display: none;">
    <!-- SIDEBAR (dynamic based on role) -->
    <aside class="sidebar" id="sidebarMenu"></aside>

    <!-- MAIN CONTENT (dynamic page views) -->
    <main class="main-content" id="mainContent"></main>
</div>

<!-- MODALS (global) -->
<div class="modal-overlay" id="genericModal"><div class="modal" id="modalContent"></div></div>

<script>
    (function(){
        // ---------- DATA (Real sample data) ----------
        // Classes & Lessons
        const classes = ['Mathematics 101', 'Physics 201', 'Literature 301'];
        const lessonsDB = {
            'Mathematics 101': {
                'Algebra': ['L1: Expressions', 'L2: Equations', 'L3: Inequalities', 'L4: Functions', 'L5: Graphs'],
                'Geometry': ['L1: Angles', 'L2: Triangles', 'L3: Circles', 'L4: Volume'],
                'Statistics': ['L1: Mean', 'L2: Median', 'L3: Mode', 'L4: Probability'],
                'Calculus': ['L1: Limits', 'L2: Derivatives', 'L3: Integrals']
            },
            'Physics 201': {
                'Mechanics': ['L1: Kinematics', 'L2: Newton Laws', 'L3: Work Energy', 'L4: Momentum'],
                'Thermodynamics': ['L1: Temperature', 'L2: Heat', 'L3: Laws of Thermodynamics'],
                'Waves': ['L1: Wave Properties', 'L2: Sound', 'L3: Light'],
                'Electricity': ['L1: Circuits', 'L2: Ohm Law', 'L3: Magnetism']
            },
            'Literature 301': {
                'Poetry': ['L1: Sonnets', 'L2: Haiku', 'L3: Free Verse'],
                'Prose': ['L1: Short Stories', 'L2: Novels', 'L3: Essays'],
                'Drama': ['L1: Tragedy', 'L2: Comedy', 'L3: Modern Plays'],
                'Criticism': ['L1: Literary Theory', 'L2: Analysis']
            }
        };

        // Teachers (with passwords and assigned classes)
        const teachers = [
            { id: 't1', name: 'Ms. Rivera', email: 'rivera@ddash.com', phone: '555-2001', classes: ['Mathematics 101', 'Physics 201'], password: 'teach123' },
            { id: 't2', name: 'Mr. Thompson', email: 'thompson@ddash.com', phone: '555-2002', classes: ['Literature 301'], password: 'teach123' },
            { id: 't3', name: 'Dr. Lee', email: 'lee@ddash.com', phone: '555-2003', classes: ['Mathematics 101', 'Literature 301'], password: 'teach123' }
        ];

        // Students (20+ with passwords)
        const studentNames = [
            'Emma Watson', 'James Lee', 'Ahmed Mansour', 'Sofia Ramirez', 'Oliver Chen', 
            'Maya Rodriguez', 'Liam Brown', 'Zoe Kim', 'Ethan Davis', 'Ava Wilson',
            'Mona Kamal', 'Mustafa Adil', 'Omar Ahmed', 'Altaher Kamal', 'Aladdin Adil',
            'Sherihan Aladdin', 'Osama Muhammad', 'Osman Ali', 'Hosam Muhammad', 'Hamza Atif'
        ];
        let students = [];
        function generateStudents() {
            students = studentNames.map((name, idx) => {
                const cls = classes[idx % classes.length];
                const accuracy = Math.floor(45 + Math.random() * 50);
                const lessonsCompleted = Math.floor(5 + Math.random() * 15);
                let status = 'Good';
                if (accuracy >= 80) status = 'Excellent';
                else if (accuracy < 50) status = 'Needs help';
                return {
                    id: idx + 1,
                    name,
                    class: cls,
                    email: name.toLowerCase().replace(/\s+/g, '.') + '@school.edu',
                    phone: `555-01${String(idx+1).padStart(2,'0')}`,
                    accuracy,
                    lessonsCompleted,
                    status,
                    password: 'student123'
                };
            });
        }
        generateStudents();

        // Progress DB (simplified)
        let progressDB = {};
        let lessonOpenState = {};
        function initProgress() {
            students.forEach(s => {
                progressDB[s.id] = {};
                const cls = s.class;
                for (let unit in lessonsDB[cls]) {
                    lessonsDB[cls][unit].forEach(lesson => {
                        const key = `${cls}|${unit}|${lesson}`;
                        const started = Math.random() > 0.3;
                        progressDB[s.id][key] = { started, completed: started && Math.random() > 0.4, accuracy: started ? Math.floor(60+Math.random()*35) : 0 };
                        lessonOpenState[key] = true;
                    });
                }
            });
        }
        initProgress();

        // Admin credentials
        const ADMIN = { username: 'admin@ddash.com', password: 'admin123' };

        // App state
        let currentUser = null; // { role, data }
        let currentPage = 'dashboard';

        // ---------- LOGIN ----------
        window.login = function() {
            const role = document.querySelector('.role-btn.active').dataset.role;
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            
            if (role === 'admin') {
                if (username === ADMIN.username && password === ADMIN.password) {
                    currentUser = { role: 'admin', data: { name: 'Administrator' } };
                    showMainApp();
                } else errorDiv.innerText = 'Invalid admin credentials';
            } else if (role === 'teacher') {
                const teacher = teachers.find(t => t.email === username && t.password === password);
                if (teacher) {
                    currentUser = { role: 'teacher', data: teacher };
                    showMainApp();
                } else errorDiv.innerText = 'Invalid teacher credentials';
            } else { // student
                const student = students.find(s => s.email === username && s.password === password);
                if (student) {
                    currentUser = { role: 'student', data: student };
                    showMainApp();
                } else errorDiv.innerText = 'Invalid student credentials';
            }
        };

        function showMainApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            renderSidebar();
            renderCurrentPage();
        }

        // Role switcher UI
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const role = this.dataset.role;
                const userField = document.getElementById('loginUsername');
                if (role === 'admin') userField.value = 'admin@ddash.com';
                else if (role === 'teacher') userField.value = 'rivera@ddash.com';
                else userField.value = 'emma.watson@school.edu';
            });
        });

        // ---------- RENDER SIDEBAR & MAIN ----------
        function renderSidebar() {
            const sidebar = document.getElementById('sidebarMenu');
            const role = currentUser.role;
            let navItems = '';
            if (role === 'admin') {
                navItems = `
                    <div class="logo-area"><div class="logo-icon"><i class="fas fa-shield-alt"></i></div><span class="logo-text">D-Dash Admin</span></div>
                    <div class="nav-menu">
                        <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
                        <div class="nav-item" data-page="teachers"><i class="fas fa-chalkboard-user"></i><span>Teachers</span></div>
                        <div class="nav-item" data-page="students"><i class="fas fa-user-graduate"></i><span>Students</span></div>
                        <div class="nav-item" data-page="classes"><i class="fas fa-layer-group"></i><span>Classes</span></div>
                        <div class="nav-item" data-page="reports"><i class="fas fa-file-alt"></i><span>Reports</span></div>
                    </div>
                `;
            } else if (role === 'teacher') {
                navItems = `
                    <div class="logo-area"><div class="logo-icon"><i class="fas fa-chart-line"></i></div><span class="logo-text">D-Dash Teacher</span></div>
                    <div class="nav-menu">
                        <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></div>
                        <div class="nav-item" data-page="classes"><i class="fas fa-layer-group"></i><span>My Classes</span></div>
                        <div class="nav-item" data-page="students"><i class="fas fa-user-graduate"></i><span>My Students</span></div>
                        <div class="nav-item" data-page="reports"><i class="fas fa-file-alt"></i><span>Reports</span></div>
                    </div>
                `;
            } else {
                navItems = `
                    <div class="logo-area"><div class="logo-icon"><i class="fas fa-user"></i></div><span class="logo-text">D-Dash Student</span></div>
                    <div class="nav-menu">
                        <div class="nav-item active" data-page="dashboard"><i class="fas fa-home"></i><span>My Progress</span></div>
                    </div>
                `;
            }
            navItems += `
                <div class="bottom-sidebar">
                    <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
                    <div class="about-section" onclick="showAbout()"><i class="fas fa-info-circle"></i> About</div>
                </div>
            `;
            sidebar.innerHTML = navItems;
            // Attach nav listeners
            sidebar.querySelectorAll('[data-page]').forEach(el => {
                el.addEventListener('click', () => switchPage(el.dataset.page));
            });
        }

        window.switchPage = function(pageId) {
            currentPage = pageId;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${pageId}"]`)?.classList.add('active');
            renderCurrentPage();
        };

        function renderCurrentPage() {
            const main = document.getElementById('mainContent');
            const role = currentUser.role;
            if (role === 'admin') {
                if (currentPage === 'dashboard') main.innerHTML = renderAdminDashboard();
                else if (currentPage === 'teachers') main.innerHTML = renderTeachersPage();
                else if (currentPage === 'students') main.innerHTML = renderAllStudentsPage();
                else if (currentPage === 'classes') main.innerHTML = renderAllClassesPage();
                else if (currentPage === 'reports') main.innerHTML = renderReportsPage();
            } else if (role === 'teacher') {
                // Teacher views (filtered by teacher's classes)
                const teacherClasses = currentUser.data.classes;
                if (currentPage === 'dashboard') main.innerHTML = renderTeacherDashboard(teacherClasses);
                else if (currentPage === 'classes') main.innerHTML = renderTeacherClasses(teacherClasses);
                else if (currentPage === 'students') main.innerHTML = renderTeacherStudents(teacherClasses);
                else if (currentPage === 'reports') main.innerHTML = renderReportsPage(); // could filter by teacher classes
            } else {
                main.innerHTML = renderStudentDashboard();
            }
        }

        // ---------- ADMIN PAGES ----------
        function renderAdminDashboard() {
            const totalTeachers = teachers.length;
            const totalStudents = students.length;
            const avgAccuracy = Math.round(students.reduce((a,b)=>a+b.accuracy,0)/totalStudents);
            return `
                <div class="top-bar">
                    <div class="page-title"><h1>Admin Dashboard</h1></div>
                    <div class="top-actions">
                        <span class="notification-badge"><i class="fas fa-bell"></i> System OK</span>
                        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card"><span>Total Teachers</span><div class="stat-value">${totalTeachers}</div></div>
                    <div class="stat-card"><span>Total Students</span><div class="stat-value">${totalStudents}</div></div>
                    <div class="stat-card"><span>Avg Accuracy</span><div class="stat-value">${avgAccuracy}%</div></div>
                    <div class="stat-card"><span>Classes</span><div class="stat-value">${classes.length}</div></div>
                </div>
                <div class="chart-card">
                    <h3>📊 Student Accuracy by Class</h3>
                    <canvas id="adminBarChart" style="height:200px;"></canvas>
                </div>
                <div class="action-panels">
                    <div class="panel">
                        <h4>👩‍🏫 Recent Teachers</h4>
                        ${teachers.map(t => `<div><span class="teacher-link" onclick="viewTeacher('${t.id}')">${t.name}</span> - ${t.classes.join(', ')}</div>`).join('')}
                    </div>
                    <div class="panel">
                        <h4>⚠️ Students Needing Help</h4>
                        ${students.filter(s=>s.accuracy<50).slice(0,5).map(s => `<div><span class="student-link" onclick="viewStudent(${s.id})">${s.name}</span> (${s.accuracy}%)</div>`).join('')}
                    </div>
                </div>
            `;
        }

        function renderTeachersPage() {
            return `
                <div class="top-bar"><h1>👩‍🏫 Teachers Management</h1><button class="btn-primary" onclick="openAddTeacherModal()"><i class="fas fa-plus"></i> Add Teacher</button></div>
                <div class="teacher-grid">
                    ${teachers.map(t => `
                        <div class="teacher-card" onclick="viewTeacher('${t.id}')">
                            <i class="fas fa-chalkboard-user fa-3x"></i>
                            <h3>${t.name}</h3>
                            <p>${t.email}</p>
                            <p>${t.phone}</p>
                            <p>Classes: ${t.classes.join(', ')}</p>
                            <button class="btn-outline" onclick="event.stopPropagation(); resetTeacherPassword('${t.id}')">Reset Password</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderAllStudentsPage() {
            return `
                <div class="top-bar"><h1>👥 All Students</h1><input type="text" placeholder="Search" id="studentSearch" class="search-input" oninput="filterStudentGrid()"></div>
                <div class="student-grid" id="studentGridContainer">
                    ${students.map(s => `
                        <div class="student-card" onclick="viewStudent(${s.id})">
                            <i class="fas fa-user-graduate fa-3x"></i>
                            <h3>${s.name}</h3>
                            <p>${s.class}</p>
                            <p>${s.email}</p>
                            <span class="status-pill ${s.status==='Excellent'?'status-excellent':(s.status==='Good'?'status-good':'status-need')}">${s.status}</span>
                            <button class="btn-outline" onclick="event.stopPropagation(); resetStudentPassword(${s.id})">Reset PW</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Teacher views (filtered)
        function renderTeacherDashboard(teacherClasses) {
            const classStudents = students.filter(s => teacherClasses.includes(s.class));
            const avg = Math.round(classStudents.reduce((a,b)=>a+b.accuracy,0)/classStudents.length) || 0;
            return `
                <div class="top-bar"><h1>Teacher Dashboard</h1><button class="logout-btn" onclick="logout()">Logout</button></div>
                <div class="stats-grid">
                    <div class="stat-card"><span>My Students</span><div class="stat-value">${classStudents.length}</div></div>
                    <div class="stat-card"><span>Avg Accuracy</span><div class="stat-value">${avg}%</div></div>
                </div>
                <div class="table-section">
                    <h3>My Students</h3>
                    <table class="student-table"><tr><th>Name</th><th>Class</th><th>Accuracy</th></tr>
                    ${classStudents.map(s => `<tr><td><span class="student-link" onclick="viewStudent(${s.id})">${s.name}</span></td><td>${s.class}</td><td>${s.accuracy}%</td></tr>`).join('')}
                    </table>
                </div>
            `;
        }

        function renderTeacherClasses(teacherClasses) {
            return `<div class="top-bar"><h1>My Classes</h1></div>` + teacherClasses.map(cls => `
                <div class="panel"><h3>${cls}</h3><p>Students: ${students.filter(s=>s.class===cls).length}</p></div>
            `).join('');
        }

        // Modals and actions
        window.viewTeacher = (id) => {
            const t = teachers.find(t=>t.id===id);
            showModal(`Teacher: ${t.name}`, `<p>Email: ${t.email}</p><p>Classes: ${t.classes.join(', ')}</p>`);
        };
        window.viewStudent = (id) => {
            const s = students.find(s=>s.id===id);
            showModal(`${s.name}`, `<p>Class: ${s.class} | Accuracy: ${s.accuracy}%</p><p>Email: ${s.email}</p>`);
        };
        window.resetTeacherPassword = (id) => { alert('Password reset to default: teach123'); };
        window.resetStudentPassword = (id) => { alert('Password reset to default: student123'); };
        window.openAddTeacherModal = () => { alert('Add teacher form would open'); };
        window.filterStudentGrid = () => {
            const term = document.getElementById('studentSearch')?.value.toLowerCase() || '';
            document.querySelectorAll('.student-card').forEach(card => {
                card.style.display = card.innerText.toLowerCase().includes(term) ? 'block' : 'none';
            });
        };
        window.showAbout = () => showModal('About D-Dash', 'Developed by Mr. Mustafa. All-in-one education platform.');

        function showModal(title, content) {
            document.getElementById('modalContent').innerHTML = `<h2>${title}</h2>${content}<button onclick="document.getElementById('genericModal').style.display='none'">Close</button>`;
            document.getElementById('genericModal').style.display = 'flex';
        }
        window.logout = () => {
            currentUser = null;
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
        };

        // Charts (admin)
        function renderAdminCharts() {
            const ctx = document.getElementById('adminBarChart')?.getContext('2d');
            if(ctx) new Chart(ctx, {type:'bar', data:{labels:classes, datasets:[{label:'Avg Accuracy', data:classes.map(c=> Math.round(students.filter(s=>s.class===c).reduce((a,b)=>a+b.accuracy,0)/(students.filter(s=>s.class===c).length||1)))]}});
        }

        // Init after render
        const observer = new MutationObserver(() => { if(document.getElementById('adminBarChart')) renderAdminCharts(); });
        observer.observe(document.getElementById('mainContent'), { childList: true, subtree: true });

        // Close modal
        document.getElementById('genericModal').addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) e.target.style.display='none'; });
    })();
</script>
</body>
</html>
