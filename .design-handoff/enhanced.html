<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DDash — Enhanced UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: oklch(96.5% 0.007 258);
    color: oklch(20% 0.05 258);
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(80% 0.04 258); border-radius: 9px; }
  * { transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, color 0.18s ease, opacity 0.18s ease; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── DESIGN TOKENS ──────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentHue": 258,
  "sidebarStyle": "dark",
  "buttonRadius": "full",
  "cardShadow": "soft",
  "bannerStyle": "gradient"
}/*EDITMODE-END*/;

// ── SVG ICONS ──────────────────────────────────────────────────────────────
const Icon = ({ name, size = 18, color = 'currentColor' }) => {
  const paths = {
    dashboard: <><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
    classes: <><path d="M4 19V7a1 1 0 011-1h10a1 1 0 011 1v12"/><path d="M2 19h20"/><path d="M9 11h6"/><path d="M9 15h6"/><path d="M9 7h6"/></>,
    teachers: <><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.87"/></>,
    students: <><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></>,
    reports: <><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></>,
    logout: <><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></>,
    arrow_right: <><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></>,
    check: <polyline points="20,6 9,17 4,12"/>,
    lock: <><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></>,
    play: <polygon points="5,3 19,12 5,21"/>,
    star: <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>,
    chart: <><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>,
    bell: <><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></>,
    chevron_down: <polyline points="6,9 12,15 18,9"/>,
    chevron_up: <polyline points="18,15 12,9 6,15"/>,
    x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    user: <><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    zap: <polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/>,
    target: <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
    book: <><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></>,
    trending_up: <><polyline points="23,6 13.5,15.5 8.5,10.5 1,18"/><polyline points="17,6 23,6 23,12"/></>,
    award: <><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
      {paths[name]}
    </svg>
  );
};

// ── PROGRESS RING ──────────────────────────────────────────────────────────
const ProgressRing = ({ pct = 0, size = 44, stroke = 4, color = '#3b5bdb' }) => {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="oklch(92% 0.01 258)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        style={{transition:'stroke-dashoffset 0.6s ease'}}/>
    </svg>
  );
};

// ── MINI SPARKLINE ─────────────────────────────────────────────────────────
const Sparkline = ({ data, color = '#3b5bdb', height = 28, width = 64 }) => {
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / (max - min || 1)) * height;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} style={{overflow:'visible'}}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

// ── AVATAR ─────────────────────────────────────────────────────────────────
const Avatar = ({ name, size = 36, bg = 'oklch(52% 0.22 258)', color = '#fff' }) => {
  const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{width:size, height:size, borderRadius:'50%', background:bg, color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:size*0.36, fontWeight:700, flexShrink:0, letterSpacing:'-0.02em'}}>
      {initials}
    </div>
  );
};

// ── BADGE ──────────────────────────────────────────────────────────────────
const Badge = ({ label, variant = 'default' }) => {
  const styles = {
    'in-progress': { bg:'oklch(92% 0.1 258)', color:'oklch(38% 0.2 258)', label:'In Progress' },
    'not-started': { bg:'oklch(94% 0.01 258)', color:'oklch(45% 0.04 258)', label:'Not Started' },
    'complete':    { bg:'oklch(91% 0.1 148)', color:'oklch(35% 0.18 148)', label:'Complete' },
    'locked':      { bg:'oklch(94% 0.06 52)',  color:'oklch(42% 0.14 52)',  label:'Locked' },
    'excellent':   { bg:'oklch(91% 0.1 148)', color:'oklch(32% 0.18 148)', label:'Excellent' },
    'good':        { bg:'oklch(92% 0.1 200)', color:'oklch(35% 0.18 200)', label:'Good' },
    'needs-help':  { bg:'oklch(93% 0.1 22)',  color:'oklch(38% 0.2 22)',   label:'Needs Help' },
    'no-data':     { bg:'oklch(94% 0.01 258)', color:'oklch(48% 0.04 258)', label:'No Data' },
    'default':     { bg:'oklch(94% 0.01 258)', color:'oklch(40% 0.04 258)', label },
  };
  const s = styles[variant] || styles.default;
  return (
    <span style={{display:'inline-flex', alignItems:'center', gap:5, padding:'3px 10px', borderRadius:9999, background:s.bg, color:s.color, fontSize:12, fontWeight:600, whiteSpace:'nowrap', letterSpacing:'0.01em'}}>
      {variant === 'locked' && <Icon name="lock" size={11} color={s.color}/>}
      {s.label || label}
    </span>
  );
};

// ── BUTTON ─────────────────────────────────────────────────────────────────
const Btn = ({ children, variant='primary', size='md', icon, onClick, style: extraStyle={} }) => {
  const [hov, setHov] = useState(false);
  const base = {
    display:'inline-flex', alignItems:'center', gap:7, fontFamily:'inherit',
    fontWeight:600, cursor:'pointer', border:'none', letterSpacing:'-0.01em',
    transition:'all 0.18s ease',
  };
  const sizes = {
    sm: { padding:'6px 14px', fontSize:12, borderRadius:8 },
    md: { padding:'9px 18px', fontSize:13, borderRadius:10 },
    lg: { padding:'12px 24px', fontSize:14, borderRadius:12 },
    full: { padding:'9px 18px', fontSize:13, borderRadius:9999 },
  };
  const variants = {
    primary: {
      background: hov ? 'oklch(45% 0.24 258)' : 'oklch(50% 0.24 258)',
      color: '#fff',
      boxShadow: hov ? '0 8px 24px oklch(50% 0.24 258 / 0.38)' : '0 2px 8px oklch(50% 0.24 258 / 0.22)',
      transform: hov ? 'translateY(-1px)' : 'translateY(0)',
    },
    secondary: {
      background: hov ? 'oklch(95% 0.012 258)' : 'white',
      color: 'oklch(30% 0.08 258)',
      border: '1.5px solid oklch(88% 0.02 258)',
      boxShadow: hov ? '0 4px 12px oklch(20% 0.05 258 / 0.08)' : '0 1px 3px oklch(20% 0.05 258 / 0.06)',
      transform: hov ? 'translateY(-1px)' : 'translateY(0)',
    },
    ghost: {
      background: hov ? 'oklch(93% 0.015 258)' : 'transparent',
      color: 'oklch(42% 0.08 258)',
    },
    danger: {
      background: hov ? 'oklch(94% 0.06 22)' : 'transparent',
      color: hov ? 'oklch(40% 0.2 22)' : 'oklch(48% 0.15 22)',
      border: '1.5px solid oklch(88% 0.06 22)',
    },
    teal: {
      background: hov ? 'oklch(54% 0.18 200)' : 'oklch(58% 0.18 200)',
      color: '#fff',
      boxShadow: hov ? '0 8px 20px oklch(58% 0.18 200 / 0.35)' : '0 2px 8px oklch(58% 0.18 200 / 0.2)',
      transform: hov ? 'translateY(-1px)' : 'translateY(0)',
    },
    success: {
      background: hov ? 'oklch(50% 0.18 148)' : 'oklch(55% 0.18 148)',
      color: '#fff',
      boxShadow: hov ? '0 8px 20px oklch(55% 0.18 148 / 0.35)' : '0 2px 8px oklch(55% 0.18 148 / 0.2)',
      transform: hov ? 'translateY(-1px)' : 'translateY(0)',
    },
  };
  const sizeKey = size === 'full' ? 'full' : size;
  return (
    <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{...base, ...sizes[sizeKey], ...variants[variant], ...extraStyle}}>
      {icon && <Icon name={icon} size={sizeKey==='sm'?13:15} color="currentColor"/>}
      {children}
    </button>
  );
};

// ── STAT CARD ──────────────────────────────────────────────────────────────
const StatCard = ({ label, value, icon, color, sparkData, trend }) => {
  const colorMap = {
    blue:  { bg:'oklch(50% 0.24 258)', light:'oklch(94% 0.06 258)', text:'oklch(38% 0.2 258)' },
    teal:  { bg:'oklch(58% 0.18 200)', light:'oklch(93% 0.06 200)', text:'oklch(35% 0.16 200)' },
    green: { bg:'oklch(55% 0.18 148)', light:'oklch(93% 0.07 148)', text:'oklch(33% 0.16 148)' },
    amber: { bg:'oklch(72% 0.16 72)',  light:'oklch(94% 0.07 72)',  text:'oklch(40% 0.16 72)' },
    purple:{ bg:'oklch(58% 0.2 300)',  light:'oklch(94% 0.06 300)', text:'oklch(36% 0.18 300)' },
  };
  const c = colorMap[color] || colorMap.blue;
  return (
    <div style={{background:'white', borderRadius:16, padding:'20px 22px', display:'flex', flexDirection:'column', gap:12, boxShadow:'0 1px 4px oklch(20% 0.05 258 / 0.06)', border:'1px solid oklch(93% 0.01 258)', flex:1, minWidth:0, overflow:'hidden', position:'relative'}}>
      <div style={{position:'absolute', top:0, left:0, right:0, height:3, background:c.bg, borderRadius:'16px 16px 0 0'}}/>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
        <div style={{width:40, height:40, borderRadius:12, background:c.light, display:'flex', alignItems:'center', justifyContent:'center'}}>
          <Icon name={icon} size={20} color={c.bg}/>
        </div>
        {sparkData && <Sparkline data={sparkData} color={c.bg}/>}
      </div>
      <div>
        <div style={{fontSize:28, fontWeight:800, letterSpacing:'-0.04em', color:'oklch(18% 0.06 258)', lineHeight:1}}>{value}</div>
        <div style={{fontSize:12.5, color:'oklch(52% 0.04 258)', marginTop:4, fontWeight:500}}>{label}</div>
      </div>
      {trend !== undefined && (
        <div style={{display:'flex', alignItems:'center', gap:4, fontSize:11.5, fontWeight:600, color: trend >= 0 ? 'oklch(45% 0.18 148)' : 'oklch(45% 0.2 22)'}}>
          <Icon name={trend >= 0 ? 'trending_up' : 'trending_up'} size={13} color="currentColor"/>
          {trend >= 0 ? '+' : ''}{trend}% this week
        </div>
      )}
    </div>
  );
};

// ── SIDEBAR ────────────────────────────────────────────────────────────────
const Sidebar = ({ role, activeScreen, setScreen, tweaks }) => {
  const isDark = tweaks.sidebarStyle !== 'light';
  const bg = isDark ? 'oklch(18% 0.08 258)' : 'white';
  const textMuted = isDark ? 'oklch(62% 0.05 258)' : 'oklch(52% 0.04 258)';
  const textActive = isDark ? 'white' : 'oklch(30% 0.08 258)';
  const border = isDark ? 'oklch(26% 0.06 258)' : 'oklch(90% 0.01 258)';

  const studentItems = [
    { id:'dashboard', label:'Dashboard', icon:'dashboard' },
    { id:'classes',   label:'My Classes', icon:'classes' },
  ];
  const adminItems = [
    { id:'admin-dashboard', label:'Dashboard',  icon:'dashboard' },
    { id:'admin-teachers',  label:'Teachers',   icon:'teachers' },
    { id:'admin-students',  label:'Students',   icon:'students' },
    { id:'admin-classes',   label:'Classes',    icon:'classes' },
    { id:'admin-reports',   label:'Reports',    icon:'reports' },
    { id:'admin-settings',  label:'Settings',   icon:'settings' },
  ];
  const items = role === 'admin' ? adminItems : studentItems;
  const userName = role === 'admin' ? 'Dr. Amy Watson' : 'Jordan Bailey';
  const userEmail = role === 'admin' ? 'admin1@ddash.com' : 'demo@ddash.com';
  const userBg = role === 'admin' ? 'oklch(58% 0.18 300)' : 'oklch(50% 0.24 258)';

  const NavItem = ({ item }) => {
    const isActive = activeScreen === item.id;
    const [hov, setHov] = useState(false);
    return (
      <button onClick={()=>setScreen(item.id)}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{display:'flex', alignItems:'center', gap:11, width:'100%', padding:'9px 12px', borderRadius:10, border:'none', cursor:'pointer', fontFamily:'inherit', fontSize:13.5, fontWeight: isActive ? 600 : 500, letterSpacing:'-0.01em', background: isActive ? (isDark ? 'oklch(30% 0.12 258)' : 'oklch(93% 0.06 258)') : hov ? (isDark ? 'oklch(24% 0.06 258)' : 'oklch(96% 0.01 258)') : 'transparent', color: isActive ? (isDark ? 'white' : 'oklch(38% 0.2 258)') : textMuted, transition:'all 0.15s ease'}}>
        <div style={{width:32, height:32, borderRadius:9, background: isActive ? (isDark ? 'oklch(40% 0.18 258)' : 'oklch(88% 0.1 258)') : 'transparent', display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s ease'}}>
          <Icon name={item.icon} size={16} color={isActive ? (isDark ? 'white' : 'oklch(38% 0.2 258)') : textMuted}/>
        </div>
        {item.label}
        {isActive && <div style={{marginLeft:'auto', width:6, height:6, borderRadius:'50%', background:'oklch(65% 0.2 258)', flexShrink:0}}/>}
      </button>
    );
  };

  return (
    <div style={{width:220, flexShrink:0, height:'100vh', background:bg, display:'flex', flexDirection:'column', borderRight:`1px solid ${border}`, position:'relative', overflow:'hidden'}}>
      {/* Top gradient accent */}
      <div style={{position:'absolute', top:0, left:0, right:0, height:180, background:`radial-gradient(ellipse at 50% 0%, oklch(35% 0.18 258 / 0.4), transparent)`, pointerEvents:'none'}}/>
      
      {/* Logo */}
      <div style={{padding:'22px 18px 16px', display:'flex', alignItems:'center', gap:10, position:'relative'}}>
        <div style={{width:36, height:36, borderRadius:10, background:'linear-gradient(135deg, oklch(55% 0.24 258), oklch(48% 0.22 290))', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 12px oklch(50% 0.24 258 / 0.4)'}}>
          <Icon name="zap" size={18} color="white"/>
        </div>
        <div>
          <div style={{fontWeight:800, fontSize:15, color: isDark ? 'white' : 'oklch(18% 0.06 258)', letterSpacing:'-0.03em'}}>D-Dash</div>
          <div style={{fontSize:10.5, color: textMuted, fontWeight:500, marginTop:1}}>{role === 'admin' ? 'Admin Panel' : 'Student Portal'}</div>
        </div>
      </div>

      <div style={{width:'calc(100% - 24px)', height:1, background:border, margin:'2px 12px 10px'}}/>

      {/* Role switcher */}
      <div style={{padding:'0 10px 10px', display:'flex', gap:4}}>
        {['student','admin'].map(r => (
          <button key={r} onClick={()=>{}} style={{flex:1, padding:'5px', borderRadius:7, border:`1.5px solid ${r===role ? 'oklch(50% 0.24 258)' : border}`, background: r===role ? 'oklch(50% 0.24 258)' : 'transparent', color: r===role ? 'white' : textMuted, fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:'inherit', textTransform:'capitalize', transition:'all 0.15s'}}
            onClick={()=>setScreen(r==='admin'?'admin-dashboard':'dashboard')}>
            {r}
          </button>
        ))}
      </div>

      {/* Nav */}
      <nav style={{padding:'4px 10px', flex:1, display:'flex', flexDirection:'column', gap:2, overflow:'auto'}}>
        {items.map(item => <NavItem key={item.id} item={item}/>)}
      </nav>

      {/* User footer */}
      <div style={{padding:'12px 10px', borderTop:`1px solid ${border}`}}>
        <div style={{display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:10, background: isDark ? 'oklch(24% 0.06 258)' : 'oklch(96% 0.01 258)'}}>
          <Avatar name={userName} size={32} bg={userBg}/>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:12.5, fontWeight:600, color: isDark ? 'white' : 'oklch(18% 0.06 258)', letterSpacing:'-0.01em', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{userName}</div>
            <div style={{fontSize:10.5, color:textMuted, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{userEmail}</div>
          </div>
        </div>
        <button style={{display:'flex', alignItems:'center', gap:8, width:'100%', padding:'8px 10px', marginTop:4, borderRadius:10, border:'none', background:'transparent', cursor:'pointer', fontFamily:'inherit', fontSize:12.5, fontWeight:500, color:'oklch(55% 0.18 22)', transition:'all 0.15s'}}
          onMouseEnter={e=>{e.currentTarget.style.background=isDark?'oklch(24% 0.06 258)':'oklch(96% 0.04 22)'}}
          onMouseLeave={e=>{e.currentTarget.style.background='transparent'}}>
          <Icon name="logout" size={14} color="currentColor"/> Log out

// ── SCREEN CONTENT ROUTER ──────────────────────────────────────────────────
const screenTitles = {
  'dashboard':        'Dashboard',
  'classes':          'My Classes',
  'admin-dashboard':  'Dashboard',
  'admin-teachers':   'Teachers',
  'admin-students':   'Students',
  'admin-classes':    'Classes',
  'admin-reports':    'Reports',
  'admin-settings':   'Settings',
};

// ── APP ────────────────────────────────────────────────────────────────────
const App = () => {
  const [screen, setScreen] = useState('dashboard');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const role = screen.startsWith('admin') ? 'admin' : 'student';
  const title = screenTitles[screen] || 'Dashboard';

  const renderScreen = () => {
    if (screen === 'dashboard')       return <StudentDashboard tweaks={tweaks}/>;
    if (screen === 'classes')         return <MyClasses tweaks={tweaks}/>;
    if (screen === 'admin-dashboard') return <AdminDashboard tweaks={tweaks}/>;
    if (screen === 'admin-teachers')  return <AdminTeachers tweaks={tweaks}/>;
    if (screen === 'admin-reports')   return <AdminReports tweaks={tweaks}/>;
    return (
      <div style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', height:320, gap:12, opacity:0.5}}>
        <Icon name="book" size={40} color="oklch(65% 0.04 258)"/>
        <div style={{fontSize:14, color:'oklch(52% 0.04 258)', fontWeight:500}}>{title} — coming soon in this mockup</div>
      </div>
    );
  };

  return (
    <>
      <TweaksPanel tweaks={tweaks} setTweak={setTweak}>
        <TweakSection label="Sidebar">
          <TweakRadio id="sidebarStyle" label="Style" options={['dark','light']}/>
        </TweakSection>
        <TweakSection label="Buttons">
          <TweakRadio id="buttonRadius" label="Shape" options={['full','rounded']}/>
        </TweakSection>
        <TweakSection label="Cards">
          <TweakRadio id="cardShadow" label="Shadow" options={['soft','flat','elevated']}/>
        </TweakSection>
        <TweakSection label="Accent Hue">
          <TweakSlider id="accentHue" label="Hue" min={200} max={320} step={5}/>
        </TweakSection>
      </TweaksPanel>

      <div style={{display:'flex', height:'100vh', overflow:'hidden'}}>
        <Sidebar role={role} activeScreen={screen} setScreen={setScreen} tweaks={tweaks}/>
        <div style={{flex:1, display:'flex', flexDirection:'column', overflow:'hidden'}}>
          <TopBar title={title} role={role}/>
          <div style={{flex:1, overflow:'auto', padding:'24px 28px'}}>
            {renderScreen()}
          </div>
        </div>
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
